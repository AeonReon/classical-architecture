<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FBEE6"/>
      <stop offset="1" stop-color="#3F8FCB"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#F3E9D2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <!-- pediment -->
  <polygon points="256,96 400,190 112,190" fill="url(#stone)"/>
  <polygon points="256,120 372,196 140,196" fill="#3F8FCB" opacity="0.10"/>
  <!-- architrave / entablature -->
  <rect x="104" y="196" width="304" height="30" rx="6" fill="url(#stone)"/>
  <!-- columns -->
  <g fill="url(#stone)">
    <rect x="132" y="232" width="34" height="180" rx="3"/>
    <rect x="196" y="232" width="34" height="180" rx="3"/>
    <rect x="282" y="232" width="34" height="180" rx="3"/>
    <rect x="346" y="232" width="34" height="180" rx="3"/>
  </g>
  <!-- flutes -->
  <g stroke="#D8C9A6" stroke-width="3" opacity="0.7">
    <line x1="143" y1="240" x2="143" y2="408"/><line x1="155" y1="240" x2="155" y2="408"/>
    <line x1="207" y1="240" x2="207" y2="408"/><line x1="219" y1="240" x2="219" y2="408"/>
    <line x1="293" y1="240" x2="293" y2="408"/><line x1="305" y1="240" x2="305" y2="408"/>
    <line x1="357" y1="240" x2="357" y2="408"/><line x1="369" y1="240" x2="369" y2="408"/>
  </g>
  <!-- stylobate steps -->
  <rect x="96" y="414" width="320" height="22" rx="5" fill="url(#stone)"/>
  <rect x="80" y="440" width="352" height="24" rx="6" fill="url(#stone)"/>
</svg>
