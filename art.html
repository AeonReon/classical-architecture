<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EC">
  <title>Classical Architecture — Art</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .art-banner{ position:relative; border-radius:18px; overflow:hidden; height:172px; margin:2px 0 18px; box-shadow:0 3px 8px rgba(60,45,20,.10),0 14px 32px rgba(60,45,20,.14); }
    .art-banner img{ width:100%; height:100%; object-fit:cover; display:block; }
    .art-banner::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.18)); }
    .method-page .method-hero{ padding-top:0; }
    .sub-tile-section .rtile-list{ margin-top:4px; }
    /* Continue footer — carry the reader 1→2→3→4→5 without going back out */
    .sub-nav{ display:flex; gap:10px; align-items:stretch; margin:30px 0 10px; }
    .sub-nav-btn{ text-decoration:none; border-radius:14px; padding:12px 16px; font-family:var(--sans); font-weight:800; box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .15s ease; display:flex; flex-direction:column; justify-content:center; }
    .sub-nav-btn:active{ transform:scale(.98); }
    .sub-prev{ flex:none; align-self:stretch; display:flex; align-items:center; background:#fff; color:var(--ink); border:1.5px solid var(--rule); font-size:.86em; }
    .sub-next{ flex:1; text-align:right; color:#fff; gap:2px; background:linear-gradient(135deg,var(--m-color,#7c3aed),var(--m-deep,#5b21b6)); box-shadow:0 4px 14px rgba(60,45,20,.2); }
    .sub-next .sn-kick{ font-size:.68em; font-weight:800; letter-spacing:.06em; text-transform:uppercase; opacity:.92; }
    .sub-next .sn-title{ font-size:1.06em; }
    .sub-finish{ background:linear-gradient(135deg,#2FA96B,#1B7A4A); }
    /* "Try it" beginner exercises */
    .tryit-q{ font-weight:700; color:var(--ink); font-size:1.05em; line-height:1.4; margin-bottom:12px; }
    .tryit-opts{ display:flex; flex-direction:column; gap:8px; }
    .tryit-opt{ text-align:left; cursor:pointer; background:#fff; border:1.5px solid var(--rule); border-radius:12px; padding:12px 14px; font:600 1em var(--sans); color:var(--ink); transition:border-color .12s ease, background .12s ease; }
    .tryit-opt:hover:not(:disabled){ border-color:var(--m-color,#7c3aed); }
    .tryit-opt:disabled{ cursor:default; }
    .tryit-opt.correct{ border-color:#1F8F5E; background:#E7F6EE; color:#13603f; font-weight:800; }
    .tryit-opt.wrong{ border-color:#D9534F; background:#FBEAEA; color:#a3312d; }
    .tryit-fb{ margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--m-soft,#f0eef7); color:var(--ink-soft); font-size:.95em; line-height:1.5; }
    .tryit-fb.ok{ background:#E7F6EE; }
    .tryit-fb b{ color:var(--ink); }
    .tryit-hint{ font-size:.9em; color:var(--ink-mute); font-style:italic; margin-bottom:12px; }
    .tryit-reveal-btn, .tryit-mem-btn{ cursor:pointer; border:0; border-radius:999px; padding:.62em 1.2em; font:800 .9em var(--sans); color:#fff; background:linear-gradient(135deg,var(--m-color,#7c3aed),var(--m-deep,#5b21b6)); }
    .tryit-reveal{ margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--m-soft,#f0eef7); color:var(--ink-soft); line-height:1.55; }
    .tryit-mem-label{ font:800 .72rem var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--m-deep,#5b21b6); margin-bottom:8px; }
    .tryit-mem-text{ font-size:1.1em; line-height:1.5; color:var(--ink); transition:filter .2s ease; }
    .tryit-mem-text.blurred{ filter:blur(7px); user-select:none; }
    .tryit-mem-src{ margin-top:8px; font-weight:700; color:var(--m-deep,#5b21b6); font-size:.9em; }
    .tryit-mem-btn{ margin-top:12px; }
    .tryit-more{ display:block; text-decoration:none; margin-top:16px; padding:16px 18px; border-radius:16px; color:#fff; background:linear-gradient(135deg,var(--m-color,#7c3aed),var(--m-deep,#5b21b6)); box-shadow:0 4px 14px rgba(60,45,20,.2); }
    .tryit-more-note{ display:block; font-size:.92em; opacity:.95; line-height:1.45; margin-bottom:9px; }
    .tryit-more-cta{ display:block; font-weight:800; font-size:1.06em; }
    /* Inline illustrative image inside a principle card */
    .pfig{ margin:2px 0 14px; border-radius:13px; overflow:hidden; background:var(--m-soft,#f0eef7); box-shadow:0 2px 4px rgba(60,45,20,.08),0 8px 20px rgba(60,45,20,.10); }
    .pfig img{ display:block; width:100%; height:auto; }
    .pfig figcaption{ padding:8px 13px 9px; font-size:.83em; line-height:1.4; color:var(--ink-mute,#7a7488); font-style:italic; background:#fff; }
    .principle-card .pfig{ margin-top:6px; }
    /* Masters — key works + read-more link */
    .master-works{ margin-top:12px; padding-top:11px; border-top:1px solid var(--rule,#EADFC6); }
    .master-works .mw-label{ display:block; font:800 .68rem var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--m-deep,#5b21b6); margin-bottom:6px; }
    .master-works ul{ margin:0; padding-left:1.15em; }
    .master-works li{ font-size:.94em; line-height:1.5; color:var(--ink-soft,#4d4658); margin:.2em 0; }
    .master-works li i{ color:var(--ink-mute,#7a7488); }
    .master-link{ display:inline-flex; align-items:center; gap:.35em; margin-top:12px; font:800 .9em var(--sans); color:#fff; text-decoration:none;
      background:linear-gradient(135deg,var(--m-color,#7c3aed),var(--m-deep,#5b21b6)); padding:.5em 1em; border-radius:999px; box-shadow:0 3px 10px rgba(60,45,20,.16); }
    .master-head{ display:flex; align-items:center; gap:13px; margin-bottom:8px; }
    .master-head h3{ margin:0; }
    .master-avatar{ flex:none; width:64px; height:64px; border-radius:50%; object-fit:cover; object-position:top center;
      box-shadow:0 2px 7px rgba(0,0,0,.22); border:3px solid #fff; background:var(--m-soft,#eee); }
    .read-hero, .section-hero{ margin:0 0 16px; }
    .activity-card .actfig{ margin:2px 0 10px; }

    /* ============================================================
       Single-page "read it all here" profile (Wikipedia-style)
       ============================================================ */
    .wiki-hero{ margin:2px 0 6px; }
    .wiki-hero .wh-eyebrow{ font:800 .68rem/1 var(--sans); letter-spacing:.12em; text-transform:uppercase; color:var(--m-deep,#7A360A); opacity:.9; }
    .wiki-hero h1{ margin:.3em 0 0; font-weight:800; font-size:clamp(27px,7vw,38px); line-height:1.05; letter-spacing:-.02em; color:var(--ink); }
    .wiki-hero .wh-essence{ margin:.55em 0 0; font-size:1.06em; line-height:1.5; color:var(--ink-soft); }
    .wiki-banner{ position:relative; border-radius:18px; overflow:hidden; height:190px; margin:16px 0 6px; box-shadow:0 3px 8px rgba(60,45,20,.10),0 14px 32px rgba(60,45,20,.14); }
    .wiki-banner img{ width:100%; height:100%; object-fit:cover; display:block; }
    .wiki-banner figcaption{ position:absolute; left:0; right:0; bottom:0; padding:26px 15px 11px; font-size:.82em; line-height:1.4; color:#fff; background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.62)); }

    /* Section label — matches the family accent rule */
    .wiki-label{ font:800 .74rem/1 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--m-deep,#7A360A); margin:34px 0 14px; display:flex; align-items:center; gap:.6em; }
    .wiki-label::after{ content:""; flex:1; height:1.5px; border-radius:2px; background:linear-gradient(90deg,color-mix(in srgb, var(--m-color,#B4560F) 50%, transparent),transparent); }

    /* At a glance — quick-fact chips */
    .wiki-glance{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:2px 0 2px; }
    .wg-chip{ position:relative; background:#fff; border-radius:14px; padding:12px 14px; box-shadow:var(--shadow-sm); overflow:hidden; }
    .wg-chip::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3.5px; background:linear-gradient(180deg,var(--m-color,#B4560F),var(--m-deep,#7A360A)); }
    .wg-chip .wg-l{ font:800 .64rem/1 var(--sans); letter-spacing:.07em; text-transform:uppercase; color:var(--m-deep,#7A360A); opacity:.85; }
    .wg-chip .wg-v{ margin-top:.4em; font-size:.94em; line-height:1.4; color:var(--ink); font-weight:600; }
    @media (max-width:420px){ .wiki-glance{ grid-template-columns:1fr; } }

    .wiki-prose p{ font-size:1.04em; line-height:1.66; color:var(--ink-soft); margin:0 0 .85em; }

    /* Key features */
    .wiki-feat{ display:flex; flex-direction:column; gap:14px; }
    .wf-card{ background:#fff; border-radius:16px; overflow:hidden; box-shadow:var(--shadow-sm); }
    .wf-card img{ display:block; width:100%; height:170px; object-fit:cover; }
    .wf-body{ padding:14px 16px 16px; }
    .wf-body h3{ margin:0 0 .35em; font-weight:800; font-size:1.1em; letter-spacing:-.01em; color:var(--ink); line-height:1.22; }
    .wf-body p{ margin:0; font-size:.97em; line-height:1.56; color:var(--ink-soft); }
    .wf-cap{ font-size:.82em; font-style:italic; color:var(--ink-mute); margin:0 0 .55em; }

    /* How to spot it — checklist */
    .wiki-spot{ background:linear-gradient(160deg,var(--m-soft,#F7E3D2),#FFFDF9); border-radius:16px; padding:6px 18px 8px; }
    .wiki-spot li{ list-style:none; position:relative; padding:12px 0 12px 30px; font-size:1em; line-height:1.5; color:var(--ink-soft); border-bottom:1px solid color-mix(in srgb, var(--m-color,#B4560F) 18%, transparent); }
    .wiki-spot li:last-child{ border-bottom:0; }
    .wiki-spot ul{ margin:0; padding:0; }
    .wiki-spot li::before{ content:"✓"; position:absolute; left:0; top:11px; font-weight:900; color:var(--m-deep,#7A360A); }
    .wiki-spot u{ text-decoration:none; font-weight:700; color:var(--ink); border-bottom:2px solid color-mix(in srgb, var(--m-color,#B4560F) 55%, transparent); }

    /* Memory aids */
    .wiki-mem{ display:flex; flex-direction:column; gap:11px; }
    .wm-card{ position:relative; background:#fff; border-radius:14px; padding:14px 16px 14px 18px; box-shadow:var(--shadow-sm); overflow:hidden; }
    .wm-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(180deg,var(--m-color,#B4560F),var(--m-deep,#7A360A)); }
    .wm-kick{ font:800 .7rem/1 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--m-deep,#7A360A); margin-bottom:.4em; }
    .wm-text{ font-size:1.0em; line-height:1.52; color:var(--ink); }

    /* Famous buildings */
    .wiki-ex{ display:flex; flex-direction:column; gap:14px; }
    .we-card{ background:#fff; border-radius:16px; overflow:hidden; box-shadow:var(--shadow-sm); }
    .we-card img{ display:block; width:100%; height:180px; object-fit:cover; }
    .we-body{ padding:13px 16px 15px; }
    .we-name{ font-weight:800; font-size:1.08em; color:var(--ink); line-height:1.2; }
    .we-where{ margin:.25em 0 .5em; font:700 .8rem var(--sans); letter-spacing:.02em; text-transform:uppercase; color:var(--m-deep,#7A360A); opacity:.85; }
    .we-note{ margin:0; font-size:.95em; line-height:1.5; color:var(--ink-soft); }

    /* FAQ — tap-open drop-downs */
    .wiki-faq details{ background:#fff; border-radius:14px; box-shadow:var(--shadow-sm); margin-bottom:10px; overflow:hidden; }
    .wiki-faq summary{ list-style:none; cursor:pointer; padding:15px 44px 15px 16px; font-weight:700; font-size:1.01em; color:var(--ink); position:relative; }
    .wiki-faq summary::-webkit-details-marker{ display:none; }
    .wiki-faq summary::after{ content:"+"; position:absolute; right:16px; top:50%; transform:translateY(-50%); font:800 1.3em/1 var(--sans); color:var(--m-deep,#7A360A); transition:transform .2s ease; }
    .wiki-faq details[open] summary::after{ content:"–"; }
    .wiki-faq .fa-a{ padding:0 16px 16px; font-size:.98em; line-height:1.6; color:var(--ink-soft); }

    /* Reading */
    .wiki-books{ background:#fff; border-radius:16px; padding:6px 18px; box-shadow:var(--shadow-sm); }
    .wiki-books ul{ margin:0; padding:0; }
    .wiki-books li{ list-style:none; padding:14px 0; border-bottom:1px solid var(--rule); }
    .wiki-books li:last-child{ border-bottom:0; }
    .wiki-books .wb-title{ font-weight:800; color:var(--ink); }
    .wiki-books .wb-auth{ color:var(--ink-mute); }
    .wiki-books .wb-note{ display:block; margin-top:.3em; font-size:.9em; line-height:1.5; color:var(--ink-soft); }
    .wiki-read{ display:inline-flex; align-items:center; gap:.5em; margin:30px 0 0; cursor:pointer; font:800 .95em var(--sans); color:var(--m-deep,#7A360A); background:#fff; border:1.6px solid currentColor; padding:.62em 1.2em; border-radius:999px; box-shadow:var(--shadow-sm); }

    /* ── Watch — one curated video per topic. Facade only: a thumbnail until
       tapped, then the real player is injected, so nothing loads from YouTube
       and no cookies are set on page load. The creator still gets the view.
       `start` deep-links into a longer film (used by the five orders). ── */
    .watch-sec{ margin:26px 0 8px; }
    .watch-card{ border-radius:16px; overflow:hidden; background:#fff;
      border:1.5px solid rgba(0,0,0,.09); box-shadow:0 2px 14px rgba(0,0,0,.06); }
    .watch-play{ display:block; width:100%; padding:0; border:0; background:#0d0b12; cursor:pointer;
      position:relative; aspect-ratio:16/9; line-height:0; }
    .watch-play img{ width:100%; height:100%; object-fit:cover; opacity:.93;
      transition:opacity .25s ease, transform .35s cubic-bezier(0.34,1.56,0.64,1); }
    .watch-play:hover img{ opacity:1; transform:scale(1.03); }
    .watch-btn{ position:absolute; inset:0; margin:auto; width:64px; height:64px; border-radius:50%;
      background:linear-gradient(135deg,var(--c,#B07C3A),var(--cd,#2F4550));
      box-shadow:0 6px 22px rgba(0,0,0,.38); display:flex; align-items:center; justify-content:center;
      transition:transform .3s cubic-bezier(0.34,1.56,0.64,1); }
    .watch-play:hover .watch-btn{ transform:scale(1.1); }
    .watch-btn::after{ content:""; width:0; height:0; margin-left:5px;
      border-left:19px solid #fff; border-top:12px solid transparent; border-bottom:12px solid transparent; }
    .watch-len{ position:absolute; right:9px; bottom:9px; background:rgba(12,10,18,.82); color:#fff;
      font:800 .78rem/1 -apple-system,system-ui,sans-serif; padding:5px 8px; border-radius:7px; }
    .watch-card iframe{ display:block; width:100%; aspect-ratio:16/9; border:0; }
    .watch-tt{ padding:14px 16px 15px; }
    .watch-name{ font:800 1.04em/1.32 -apple-system,system-ui,sans-serif; letter-spacing:-.01em; }
    .watch-meta{ margin-top:5px; font:700 .84em -apple-system,system-ui,sans-serif; color:var(--cd,#2F4550); }
    .watch-meta span{ opacity:.6; font-weight:600; }
    .watch-why{ margin:10px 0 0; font-size:.96em; line-height:1.6; }
    .watch-note{ margin-top:11px; padding:10px 12px; border-radius:11px; background:rgba(0,0,0,.045);
      font-size:.88em; line-height:1.55; }
    .watch-note b{ color:var(--cd,#2F4550); }
    .watch-out{ display:inline-block; margin-top:11px; font:700 .86em -apple-system,system-ui,sans-serif;
      opacity:.6; text-decoration:none; color:inherit; }
  </style>
</head>
<body class="method-page">
  <main id="root" class="method-main"></main>

  <script src="assets/elements-data.js"></script>
  <script src="assets/styles-data.js"></script>
  <script src="assets/videos-data.js"></script>
  <script src="assets/tryit-data.js"></script>
  <script src="assets/profiles.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const SUB_ICONS = {
      'try-it': '<circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="32" r="12" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="32" r="4" fill="currentColor"/>',
      'what-it-is': '<circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="4"/><polygon points="32,16 38,32 32,48 26,32" fill="currentColor"/>',
      'the-path': '<path d="M12 50 Q 20 30 32 30 Q 44 30 52 14" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="12" cy="50" r="4" fill="currentColor"/><circle cx="32" cy="30" r="4" fill="currentColor"/><circle cx="52" cy="14" r="4" fill="currentColor"/>',
      'practice': '<path d="M20 36 V22 a3 3 0 0 1 6 0 V32 V18 a3 3 0 0 1 6 0 V32 V20 a3 3 0 0 1 6 0 V34 V24 a3 3 0 0 1 6 0 V42 a14 14 0 0 1 -14 14 H26 a8 8 0 0 1 -8 -8 V40 a4 4 0 0 1 2 -4 Z" fill="currentColor"/>',
      'reading': '<rect x="14" y="14" width="36" height="40" rx="2" fill="currentColor"/><rect x="16" y="16" width="32" height="36" rx="1" fill="white"/><line x1="22" y1="24" x2="42" y2="24" stroke="currentColor" stroke-width="2.5"/><line x1="22" y1="32" x2="42" y2="32" stroke="currentColor" stroke-width="2.5"/><line x1="22" y1="40" x2="36" y2="40" stroke="currentColor" stroke-width="2.5"/>',
      'masters': '<polygon points="32,8 38,26 56,26 42,38 48,56 32,46 16,56 22,38 8,26 26,26" fill="currentColor"/>'
    };

    const SECTION_ORDER = ['what-it-is', 'the-path', 'practice', 'reading', 'masters', 'try-it'];

    const SUB_TITLES = {
      'try-it': 'Try it',
      'what-it-is': 'What it is',
      'the-path': 'The path',
      'practice': 'Practice',
      'reading': 'Reading',
      'masters': 'Masters'
    };
    const SUB_TAGS = {
      'try-it': 'A few quick things to spot — do them now',
      'what-it-is': 'Definition, history, the why',
      'the-path': 'Beginner → intermediate → advanced',
      'practice': 'Things to look for, sketch and visit',
      'reading': 'Primary sources & modern guides',
      'masters': 'The architects and writers behind it'
    };
    // One image per sub-section type, shared across every art and school page.
    const SUB_IMAGES = {
      'try-it': 'assets/daily/do.jpg',
      'what-it-is': 'assets/sub/what-it-is.jpg',
      'the-path': 'assets/sub/the-path.jpg',
      'practice': 'assets/sub/practice.jpg',
      'reading': 'assets/sub/reading.jpg',
      'masters': 'assets/sub/masters.jpg'
    };

    const id = new URLSearchParams(location.search).get('id') || 'foundation';
    const a = window.ART_BY_ID(id);
    const root = document.getElementById('root');

    // Attach the "Try it" beginner exercises (if this art has any) as a section.
    if (a && window.TRYIT && window.TRYIT[id]) a.sections['try-it'] = window.TRYIT[id];

    if (!a) {
      root.innerHTML = '<h1>Not found</h1><p><a href="index.html">← Home</a></p>';
    } else {
      document.title = 'Classical Architecture — ' + a.name;
      document.documentElement.style.setProperty('--m-color', a.color);
      document.documentElement.style.setProperty('--m-deep', a.colorDeep);
      document.documentElement.style.setProperty('--m-soft', a.colorSoft);

      const sub = new URLSearchParams(location.search).get('s');
      if (sub && a.sections && a.sections[sub]) {
        renderSubSection(a, sub);
      } else if (window.PROFILES && window.PROFILES[a.id]) {
        renderProfilePage(a, window.PROFILES[a.id]);
      } else {
        renderArtLanding(a);
      }
    }

    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // Single scrolling "read it all here" page, built from a PROFILE.
    function renderProfilePage(a, p) {
      const label = (t) => `<div class="wiki-label">${t}</div>`;

      const glance = (p.atGlance && p.atGlance.length) ? `
        ${label('At a glance')}
        <div class="wiki-glance">
          ${p.atGlance.map(g => `<div class="wg-chip"><div class="wg-l">${esc(g.label)}</div><div class="wg-v">${esc(g.value)}</div></div>`).join('')}
        </div>` : '';

      const overview = (p.overview && p.overview.length) ? `
        ${label('What it is')}
        <div class="wiki-prose">${p.overview.map(x => `<p>${esc(x)}</p>`).join('')}</div>
        ${p.overviewImage ? `<figure class="wiki-banner"><img src="${esc(p.overviewImage.src)}" alt="" loading="lazy" onerror="this.closest('.wiki-banner').remove()">${p.overviewImage.caption ? `<figcaption>${esc(p.overviewImage.caption)}</figcaption>` : ''}</figure>` : ''}` : '';

      const features = (p.features && p.features.length) ? `
        ${label('Its key parts')}
        <div class="wiki-feat">
          ${p.features.map(f => `
            <div class="wf-card">
              ${f.image ? `<img src="${esc(f.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
              <div class="wf-body">
                <h3>${esc(f.name)}</h3>
                ${f.caption ? `<p class="wf-cap">${esc(f.caption)}</p>` : ''}
                <p>${esc(f.body)}</p>
              </div>
            </div>`).join('')}
        </div>` : '';

      // spot bullets allow a whitelisted <u> for underlined key terms
      const spot = (p.spot && p.spot.length) ? `
        ${label('How to spot it')}
        <div class="wiki-spot"><ul>${p.spot.map(s => `<li>${allowU(s)}</li>`).join('')}</ul></div>` : '';

      const memory = (p.memory && p.memory.length) ? `
        ${label('How to remember it')}
        <div class="wiki-mem">
          ${p.memory.map(m => `<div class="wm-card"><div class="wm-kick">${esc(m.kick)}</div><div class="wm-text">${esc(m.text)}</div></div>`).join('')}
        </div>` : '';

      const examples = (p.examples && p.examples.length) ? `
        ${label('Famous examples')}
        <div class="wiki-ex">
          ${p.examples.map(e => `
            <div class="we-card">
              ${e.image ? `<img src="${esc(e.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
              <div class="we-body">
                <div class="we-name">${esc(e.name)}</div>
                ${e.where ? `<div class="we-where">${esc(e.where)}</div>` : ''}
                <p class="we-note">${esc(e.note)}</p>
              </div>
            </div>`).join('')}
        </div>` : '';

      const architects = (p.architects && p.architects.length) ? `
        ${label('The architects')}
        ${p.architects.map(f => `
          <div class="card master-card">
            ${f.portrait
              ? `<div class="master-head"><img class="master-avatar" src="${esc(f.portrait)}" alt="" loading="lazy" onerror="this.remove()"><h3>${esc(f.name)}</h3></div>`
              : `<h3>${esc(f.name)}</h3>`}
            <p>${esc(f.what)}</p>
            ${f.works && f.works.length ? `<div class="master-works"><span class="mw-label">Key works</span><ul>${f.works.map(w => `<li>${w}</li>`).join('')}</ul></div>` : ''}
            ${f.link ? `<a class="master-link" href="${esc(f.link)}" target="_blank" rel="noopener">Find out more →</a>` : ''}
          </div>`).join('')}` : '';

      const faq = (p.faq && p.faq.length) ? `
        ${label('Questions')}
        <div class="wiki-faq">
          ${p.faq.map(f => `<details><summary>${esc(f.q)}</summary><div class="fa-a">${esc(f.a)}</div></details>`).join('')}
        </div>` : '';

      const books = (p.books && p.books.length) ? `
        ${label('Where to read more')}
        <div class="wiki-books"><ul>
          ${p.books.map(b => `<li><span class="wb-title">${esc(b.title)}</span> <span class="wb-auth">— ${esc(b.author)}</span><span class="wb-note">${esc(b.note)}</span></li>`).join('')}
        </ul></div>` : '';

      root.innerHTML = `
        <header class="wiki-hero">
          <div class="wh-eyebrow">${esc(a.group)}</div>
          <h1>${esc(a.name)}</h1>
          ${p.essence ? `<p class="wh-essence">${esc(p.essence)}</p>` : ''}
        </header>
        ${glance}
        ${overview}
        ${features}
        ${spot}
        ${memory}
        ${examples}
        ${architects}
        ${faq}
        ${books}
        <button class="wiki-read" id="wiki-read-btn">▶ Read this aloud</button>
      `;
      window.scrollTo(0, 0);
      const rb = document.getElementById('wiki-read-btn');
      if (rb) rb.addEventListener('click', () => {
        if (window.Reader && window.Reader.speaking) { window.Reader.stop(); rb.textContent = '▶ Read this aloud'; }
        else if (window.Reader) { window.Reader.readElement(root); rb.textContent = '⏹ Stop'; }
      });
    }

    // Allow only <u>…</u> through; escape everything else.
    function allowU(s) {
      return esc(s).replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>');
    }

    function renderArtLanding(a) {
      const subTiles = SECTION_ORDER.filter(key => a.sections && a.sections[key]).map(key => {
        const img = SUB_IMAGES[key];
        return `
          <a class="rtile" href="art.html?id=${a.id}&s=${key}" style="--c:${a.color};--cd:${a.colorDeep};">
            <span class="rtile-photo">${img ? `<img src="${img}" alt="" loading="lazy" onerror="this.remove()">` : ''}<span class="rtile-ic"><svg viewBox="0 0 64 64">${SUB_ICONS[key]}</svg></span></span>
            <span class="rtile-body">
              <span class="rtile-name">${SUB_TITLES[key]}</span>
              <span class="rtile-tagline">${SUB_TAGS[key]}</span>
            </span>
            <span class="rtile-chev" aria-hidden="true">→</span>
          </a>
        `;
      }).join('');

      const watchHtml = watchBlock(a);

      root.innerHTML = `
        ${a.image ? `<div class="art-banner"><img src="${a.image}" alt="" onerror="this.parentNode.remove()"></div>` : ''}
        <header class="method-hero">
          <div class="method-hero-eyebrow">${a.group}</div>
          <h1>${a.name}</h1>
          <p class="method-tagline">${a.tagline}</p>
          <p class="method-blurb">${a.blurb}</p>
        </header>

        <section class="sub-tile-section">
          <h2>Explore</h2>
          <div class="rtile-list">${subTiles}</div>
        </section>
        ${watchHtml}
      `;
      wireWatch(root);
    }

    function renderSubSection(a, key) {
      const s = a.sections[key];
      const builtSections = SECTION_ORDER.filter(k => a.sections && a.sections[k]);
      const idx = builtSections.indexOf(key);
      const total = builtSections.length;
      const prevKey = builtSections[idx - 1];
      const nextKey = builtSections[idx + 1];
      let body = '';

      if (key === 'what-it-is') {
        body = `
          <p class="lede">${s.intro}</p>
          ${s.principles.map((p, i) => `
            <div class="card principle-card">
              <div class="principle-num">${i + 1}</div>
              <h3>${p.name}</h3>
              ${p.image ? `<figure class="pfig"><img src="${p.image}" alt="" loading="lazy" onerror="this.closest('.pfig').remove()">${p.caption ? `<figcaption>${p.caption}</figcaption>` : ''}</figure>` : ''}
              <p>${p.body}</p>
              <p class="why">${p.why}</p>
            </div>
          `).join('')}
        `;
      } else if (key === 'the-path') {
        body = `
          <p class="lede">${s.intro}</p>
          ${s.heroImage ? `<figure class="pfig section-hero"><img src="${s.heroImage}" alt="" loading="lazy" onerror="this.closest('.pfig').remove()">${s.heroCaption ? `<figcaption>${s.heroCaption}</figcaption>` : ''}</figure>` : ''}
          ${s.levels.map(level => `
            <div class="card stage-card">
              <h3>${level.stage}</h3>
              <ul>${level.items.map(i => `<li>${i}</li>`).join('')}</ul>
            </div>
          `).join('')}
        `;
      } else if (key === 'practice') {
        body = `
          <p class="lede">${s.intro}</p>
          ${s.heroImage ? `<figure class="pfig section-hero"><img src="${s.heroImage}" alt="" loading="lazy" onerror="this.closest('.pfig').remove()">${s.heroCaption ? `<figcaption>${s.heroCaption}</figcaption>` : ''}</figure>` : ''}
          <div class="activity-grid">
            ${s.items.map((item, i) => `
              <div class="activity-card">
                <div class="activity-num">${i + 1}</div>
                ${item.image ? `<figure class="pfig actfig"><img src="${item.image}" alt="" loading="lazy" onerror="this.closest('.pfig').remove()">${item.caption ? `<figcaption>${item.caption}</figcaption>` : ''}</figure>` : ''}
                <div class="activity-name">${item.name}</div>
                <div class="activity-body">${item.body}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (key === 'reading') {
        body = `
          <p class="lede">${s.intro}</p>
          ${s.heroImage ? `<figure class="pfig read-hero"><img src="${s.heroImage}" alt="" loading="lazy" onerror="this.closest('.pfig').remove()">${s.heroCaption ? `<figcaption>${s.heroCaption}</figcaption>` : ''}</figure>` : ''}
          <div class="card">
            <ul class="book-list">
              ${s.books.map(b => `
                <li><strong>${b.title}</strong> — ${b.author}<br><span class="book-note">${b.note}</span></li>
              `).join('')}
            </ul>
          </div>
        `;
      } else if (key === 'masters') {
        body = `
          <p class="lede">${s.intro}</p>
          ${s.figures.map(f => `
            <div class="card master-card">
              ${f.portrait
                ? `<div class="master-head"><img class="master-avatar" src="${f.portrait}" alt="" loading="lazy" onerror="this.remove()"><h3>${f.name}</h3></div>`
                : `<h3>${f.name}</h3>`}
              <p>${f.what}</p>
              ${f.works && f.works.length ? `<div class="master-works"><span class="mw-label">Key works</span><ul>${f.works.map(w => `<li>${w}</li>`).join('')}</ul></div>` : ''}
              ${f.link ? `<a class="master-link" href="${f.link}" target="_blank" rel="noopener">Find out more →</a>` : ''}
            </div>
          `).join('')}
        `;
      } else if (key === 'try-it') {
        body = renderTryIt(s);
      }

      root.innerHTML = `
        <header class="sub-hero">
          <div class="sub-hero-eyebrow">${a.name} · ${idx + 1} of ${total}</div>
          <h1>${SUB_TITLES[key]}</h1>
          <button class="read-btn" id="sub-read-btn">▶ Read aloud</button>
        </header>
        ${body}
        <nav class="sub-nav">
          ${prevKey
            ? `<a class="sub-nav-btn sub-prev" href="art.html?id=${a.id}&s=${prevKey}">← ${SUB_TITLES[prevKey]}</a>`
            : `<a class="sub-nav-btn sub-prev" href="art.html?id=${a.id}">← Overview</a>`}
          ${nextKey
            ? `<a class="sub-nav-btn sub-next" href="art.html?id=${a.id}&s=${nextKey}"><span class="sn-kick">Next · ${idx + 2} of ${total}</span><span class="sn-title">${SUB_TITLES[nextKey]} →</span></a>`
            : `<a class="sub-nav-btn sub-next sub-finish" href="art.html?id=${a.id}"><span class="sn-kick">You've finished ${a.name}</span><span class="sn-title">Back to overview ✓</span></a>`}
        </nav>
      `;
      window.scrollTo(0, 0);
      const readBtn = document.getElementById('sub-read-btn');
      if (readBtn) {
        readBtn.addEventListener('click', () => {
          if (window.Reader.speaking) window.Reader.stop();
          else window.Reader.readElement(document.getElementById('root'));
        });
      }
      if (key === 'try-it') wireTryIt(s);
    }

    // ── Watch ──────────────────────────────────────────────────────────
    // One curated video per topic (assets/videos-data.js). Rendered as a
    // facade: a thumbnail with a play button, and only on tap do we inject the
    // real player. Keeps every page fast and cookie-free until it is wanted.
    function fmtViews(n){
      n = Number(n) || 0;
      if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
      if (n >= 1e3) return Math.round(n / 1e3) + 'K';
      return String(n);
    }

    function watchBlock(a){
      const v = (window.VIDEOS || {})[a.id];
      if (!v) return '';
      const e = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const link = 'https://www.youtube.com/watch?v=' + e(v.id) + (v.start ? '&t=' + v.start : '');
      return `
        <section class="sub-tile-section watch-sec" style="--c:${a.color};--cd:${a.colorDeep};">
          <h2>Watch</h2>
          <div class="watch-card">
            <button type="button" class="watch-play" data-vid="${e(v.id)}" data-start="${v.start || 0}" aria-label="Play: ${e(v.title)}">
              <img src="https://i.ytimg.com/vi/${e(v.id)}/maxresdefault.jpg" alt="" loading="lazy"
                   onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${e(v.id)}/hqdefault.jpg'">
              <span class="watch-btn"></span>
              ${v.mins ? `<span class="watch-len">${e(v.mins)}</span>` : ''}
            </button>
            <div class="watch-tt">
              <div class="watch-name">${e(v.title)}</div>
              <div class="watch-meta">${e(v.channel)}${v.views ? ` <span>· ${fmtViews(v.views)} views</span>` : ''}</div>
              ${v.why ? `<p class="watch-why">${e(v.why)}</p>` : ''}
              ${v.note ? `<div class="watch-note"><b>Worth knowing:</b> ${e(v.note)}</div>` : ''}
              <a class="watch-out" href="${link}" target="_blank" rel="noopener">Watch on YouTube ↗</a>
            </div>
          </div>
        </section>`;
    }

    function wireWatch(scope){
      scope.querySelectorAll('.watch-play').forEach(btn => btn.addEventListener('click', () => {
        const start = Number(btn.dataset.start) || 0;
        const f = document.createElement('iframe');
        f.src = 'https://www.youtube-nocookie.com/embed/' + btn.dataset.vid
              + '?autoplay=1&rel=0&modestbranding=1' + (start ? '&start=' + start : '');
        f.title = btn.getAttribute('aria-label') || 'Video';
        f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        f.allowFullscreen = true;
        btn.replaceWith(f);
      }));
    }

    function renderTryIt(s) {
      const cards = s.exercises.map((ex, i) => {
        if (ex.type === 'choice') {
          const opts = ex.options.map((o, j) => `<button class="tryit-opt" data-i="${j}">${o}</button>`).join('');
          return `<div class="card tryit-card" data-ex="${i}" data-answer="${ex.answer}">
              <div class="tryit-q">${ex.q}</div>
              <div class="tryit-opts">${opts}</div>
              <div class="tryit-fb" hidden></div>
            </div>`;
        }
        if (ex.type === 'reveal') {
          return `<div class="card tryit-card">
              <div class="tryit-q">${ex.q}</div>
              ${ex.hint ? `<div class="tryit-hint">${ex.hint}</div>` : ''}
              <button class="tryit-reveal-btn" data-ex="${i}">Show a model answer</button>
              <div class="tryit-reveal" id="rev-${i}" hidden>${ex.reveal}</div>
            </div>`;
        }
        if (ex.type === 'memorise') {
          return `<div class="card tryit-card">
              <div class="tryit-mem-label">Learn this by heart</div>
              <div class="tryit-mem-text" id="mem-${i}">${ex.text}</div>
              <div class="tryit-mem-src">— ${ex.source}</div>
              <button class="tryit-mem-btn" data-ex="${i}">Hide &amp; recall</button>
            </div>`;
        }
        return '';
      }).join('');
      const more = s.more ? `<a class="tryit-more" href="${s.more.href}">${s.more.note ? `<span class="tryit-more-note">${s.more.note}</span>` : ''}<span class="tryit-more-cta">${s.more.label} →</span></a>` : '';
      return `<p class="lede">${s.intro}</p>${cards}${more}`;
    }

    function wireTryIt(s) {
      root.addEventListener('click', (e) => {
        const opt = e.target.closest('.tryit-opt');
        if (opt) {
          const card = opt.closest('.tryit-card');
          if (card.dataset.done) return;
          card.dataset.done = '1';
          const answer = +card.dataset.answer;
          const chosen = +opt.dataset.i;
          const ex = s.exercises[+card.dataset.ex];
          [...card.querySelectorAll('.tryit-opt')].forEach((b, j) => {
            b.disabled = true;
            if (j === answer) b.classList.add('correct');
            else if (j === chosen) b.classList.add('wrong');
          });
          const fb = card.querySelector('.tryit-fb');
          fb.hidden = false;
          fb.classList.toggle('ok', chosen === answer);
          fb.innerHTML = `<b>${chosen === answer ? '✓ Correct.' : '✗ Not quite.'}</b> ${ex.explain}`;
          return;
        }
        const rev = e.target.closest('.tryit-reveal-btn');
        if (rev) { const r = root.querySelector('#rev-' + rev.dataset.ex); if (r) r.hidden = false; rev.hidden = true; return; }
        const mem = e.target.closest('.tryit-mem-btn');
        if (mem) { const t = root.querySelector('#mem-' + mem.dataset.ex); const hidden = t.classList.toggle('blurred'); mem.textContent = hidden ? 'Reveal' : 'Hide & recall'; }
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
  <script src="assets/reader.js"></script>
</body>
</html>
