<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EC">
  <title>Classical Architecture</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="method-page">
  <main id="root" class="method-main"></main>

  <script src="assets/elements-data.js"></script>
  <script src="assets/styles-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const META = {
      styles: {
        eyebrow: 'The Styles',
        name: 'The Great Styles',
        tagline: 'The traditions of classical building, each on its own terms',
        blurb: 'A style is a whole way of building — a set of choices about form, order and ornament that hangs together and speaks with one voice. Here are the great classical traditions: the Greek temple and the Roman city, the rebirth of antiquity in the Renaissance and the villas of Palladio, the drama of the Baroque, the restraint of the Neoclassical and Georgian age, and the grand revivals that gave us our city halls and capitols. Each is presented as its own builders understood it — not ranked, but read.',
        group: 'The Styles', color: '#4F6D7A', colorDeep: '#2F4550'
      },
      orders: {
        eyebrow: 'The Elements',
        name: 'The Orders',
        tagline: 'The five columns, and everything that hangs upon them',
        blurb: 'The order is the heart of classical architecture — a column with its base, shaft and capital, and the entablature it carries, worked out as a complete system of proportion and ornament. There are five: Tuscan and Doric, plain and strong; Ionic, with its scrolled capital; Corinthian, crowned with acanthus leaves; and the Composite, which fuses the last two. Learn the five and you hold the alphabet of the whole tradition — every classical building is written in them.',
        group: 'The Orders', color: '#B4560F', colorDeep: '#7A360A'
      }
    };

    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const m = META[id];
    const root = document.getElementById('root');

    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    if (!m) {
      root.innerHTML = '<header class="method-hero"><h1>Not found</h1><p class="method-blurb">That path doesn\'t exist. <a href="index.html">Back home</a>.</p></header>';
    } else {
      document.title = m.name + ' — Classical Architecture';
      const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', m.colorDeep);
      const arts = (window.ARTS || []).filter(a => a.group === m.group);

      const tiles = arts.map(a => `
        <a href="art.html?id=${a.id}" class="rtile" style="--c:${a.color};--cd:${a.colorDeep};">
          <span class="rtile-photo">${a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>
          <span class="rtile-body">
            <span class="rtile-name">${esc(a.name)}</span>
            <span class="rtile-tagline">${esc(a.tagline)}</span>
            ${a.short ? `<span class="rtile-count">${esc(a.short)}</span>` : ''}
          </span>
          <span class="rtile-chev" aria-hidden="true">→</span>
        </a>`).join('');

      root.innerHTML = `
        <header class="method-hero" style="--m-color:${m.color};--m-deep:${m.colorDeep};">
          <div class="method-hero-eyebrow">${esc(m.eyebrow)}</div>
          <h1>${esc(m.name)}</h1>
          <p class="method-tagline">${esc(m.tagline)}</p>
          <p class="method-blurb">${esc(m.blurb)}</p>
        </header>
        <section class="tile-section" style="margin-top:6px;">
          <div class="rtile-list">${tiles}</div>
        </section>`;
    }
  </script>
</body>
</html>
