<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EC">
  <title>Image credits — Classical Architecture</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .credits-main{ max-width:760px; margin:0 auto; padding:24px 16px 60px; }
    .credits-main h1{ font-weight:800; letter-spacing:-.03em; }
    .credits-main .lede{ color:#6b6478; line-height:1.55; margin:.4em 0 1.4em; }
    .credit{ background:#fff; border:1px solid #EADFC6; border-radius:14px; padding:13px 15px; margin:0 0 10px; box-shadow:0 2px 4px rgba(60,45,20,.06); }
    .credit .ct{ font-weight:700; color:var(--ink,#2A2038); line-height:1.3; }
    .credit .cm{ font-size:.9em; color:#7a7488; margin-top:.3em; }
    .credit a{ color:#2E84BD; word-break:break-word; }
  </style>
</head>
<body class="method-page">
  <main class="credits-main">
    <h1>Image credits</h1>
    <p class="lede">Every image in this app comes from Wikimedia Commons. Many are in the public domain; the rest are used under Creative Commons licences, credited below with thanks to the photographers and archives who shared them.</p>
    <div id="list"></div>
  </main>
  <script src="assets/app.js"></script>
  <script>
    fetch('assets/image-credits.json').then(r => r.json()).then(items => {
      const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      document.getElementById('list').innerHTML = items.map(c => `
        <div class="credit">
          <div class="ct">${esc(c.title || 'Untitled')}</div>
          <div class="cm">${esc(c.artist || 'Wikimedia Commons')} · ${esc(c.license || 'see source')}${c.source ? ` · <a href="${esc(c.source)}" target="_blank" rel="noopener">source</a>` : ''}</div>
        </div>`).join('');
    }).catch(() => { document.getElementById('list').textContent = 'Credits unavailable.'; });
  </script>
</body>
</html>
